services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    restart: unless-stopped
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: "${DOCKER_APP_URL:-http://localhost:8082}"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: "${DOCKER_DB_DATABASE:-gestion}"
      DB_USERNAME: "${DOCKER_DB_USERNAME:-laravel}"
      DB_PASSWORD: "${DOCKER_DB_PASSWORD:-laravel}"
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
      - storage_data:/var/www/html/storage
      - bootstrap_cache_data:/var/www/html/bootstrap/cache
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - gestion

  mysql:
    image: mysql:8.0.46
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${DOCKER_DB_ROOT_PASSWORD:-root}"
      MYSQL_DATABASE: "${DOCKER_DB_DATABASE:-gestion}"
      MYSQL_USER: "${DOCKER_DB_USERNAME:-laravel}"
      MYSQL_PASSWORD: "${DOCKER_DB_PASSWORD:-laravel}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping --host=127.0.0.1 --user=root --password=\"$${MYSQL_ROOT_PASSWORD}\" --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - gestion

  nginx:
    image: nginx:latest
    restart: unless-stopped
    ports:
      - "${DOCKER_WEB_PORT:-8082}:80"
    volumes:
      - .:/var/www/html:ro
      - storage_data:/var/www/html/storage:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_started
    networks:
      - gestion

  node:
    build:
      context: .
      dockerfile: Dockerfile
      target: node
    restart: unless-stopped
    environment:
      DOCKER_DEV_SERVER: "true"
      VITE_DEV_SERVER_PORT: "${DOCKER_VITE_PORT:-5174}"
      APP_URL: "${DOCKER_APP_URL:-http://localhost:8082}"
    ports:
      - "${DOCKER_VITE_PORT:-5174}:5173"
    volumes:
      - .:/var/www/html
      - node_modules_data:/var/www/html/node_modules
    networks:
      - gestion

  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    profiles:
      - ci
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - gestion

volumes:
  mysql_data:
  vendor_data:
  node_modules_data:
  storage_data:
  bootstrap_cache_data:
  jenkins_home:

networks:
  gestion:
    driver: bridge
